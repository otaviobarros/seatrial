[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seatrial"
version = "0.1.0"
description = "Run evaluation cases for agent skills on agent CLIs and compare skill revisions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["agents", "skills", "evaluation", "claude", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/otaviobarros/seatrial"
Documentation = "https://github.com/otaviobarros/seatrial/tree/main/docs"
Issues = "https://github.com/otaviobarros/seatrial/issues"
Changelog = "https://github.com/otaviobarros/seatrial/releases"

[project.scripts]
seatrial = "seatrial.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"seatrial.hosts" = ["samples/**/*"]
